<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Octopup Studio">
  <!-- Octopup as a logic mark:
       the face (two eyes over a nose) is the "because" sign ∵;
       the tentacles branch like a decision tree: one root node splits into two,
       and each of those splits into two tentacle tips.
       The root node and its two children (one high, two low) form the "therefore" sign ∴. -->
  <g fill="none" stroke="#1C2B4A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="38" r="23"/>
    <!-- trunk -->
    <path d="M60 61 L60 70"/>
    <!-- first split -->
    <path d="M60 74 C52 78 42 80 36 87"/>
    <path d="M60 74 C68 78 78 80 84 87"/>
    <!-- second split: curling tentacle tips -->
    <path d="M36 91 C30 98 24 100 22 108 C21 112 26 113 27 109"/>
    <path d="M36 91 C40 98 46 101 46 108 C46 112 42 113 41 110"/>
    <path d="M84 91 C80 98 74 101 74 108 C74 112 78 113 79 110"/>
    <path d="M84 91 C90 98 96 100 98 108 C99 112 94 113 93 109"/>
  </g>
  <!-- floppy ears -->
  <path d="M42 21 C27 21 21 44 28 55 C34 62 43 55 43 44 Z" fill="#1C2B4A"/>
  <path d="M78 21 C93 21 99 44 92 55 C86 62 77 55 77 44 Z" fill="#1C2B4A"/>
  <!-- face = ∵ -->
  <circle cx="51.5" cy="35" r="3.5" fill="#1C2B4A"/>
  <circle cx="68.5" cy="35" r="3.5" fill="#1C2B4A"/>
  <circle cx="60" cy="46" r="3.5" fill="#C8553D"/>
  <!-- decision nodes = ∴ -->
  <circle cx="60" cy="73" r="5.2" fill="#C8553D"/>
  <circle cx="36" cy="89" r="5.2" fill="#C8553D"/>
  <circle cx="84" cy="89" r="5.2" fill="#C8553D"/>
</svg>
