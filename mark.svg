<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Octopup Studio">
  <!-- Octopup as a logic mark:
       the face (two eyes over a nose) is the "because" sign ∵,
       and the three tentacle tips (one high, two low) form the "therefore" sign ∴. -->
  <g fill="none" stroke="#1C2B4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="48" r="25"/>
    <path d="M44 70 C42 84 34 92 30 102"/>
    <path d="M60 73 L60 88"/>
    <path d="M76 70 C78 84 86 92 90 102"/>
  </g>
  <!-- floppy ears -->
  <path d="M41 30 C25 30 19 54 27 66 C33 74 43 66 43 54 Z" fill="#1C2B4A"/>
  <path d="M79 30 C95 30 101 54 93 66 C87 74 77 66 77 54 Z" fill="#1C2B4A"/>
  <!-- face = ∵ -->
  <circle cx="51" cy="44" r="3.8" fill="#1C2B4A"/>
  <circle cx="69" cy="44" r="3.8" fill="#1C2B4A"/>
  <circle cx="60" cy="56" r="3.8" fill="#C8553D"/>
  <!-- tentacle tips = ∴ -->
  <circle cx="60" cy="93" r="5.5" fill="#C8553D"/>
  <circle cx="29" cy="106" r="5.5" fill="#C8553D"/>
  <circle cx="91" cy="106" r="5.5" fill="#C8553D"/>
</svg>
