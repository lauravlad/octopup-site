<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Octopup, a puppy with octopus tentacles">
  <g stroke="#7A3B2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- tentacles -->
    <path d="M78 150 C60 175 40 180 34 200 C30 214 46 220 54 208" fill="none" stroke="#FF7A6B" stroke-width="18"/>
    <path d="M98 160 C92 190 76 205 82 222" fill="none" stroke="#FF7A6B" stroke-width="18"/>
    <path d="M120 162 C120 192 118 210 128 226" fill="none" stroke="#FF8F7E" stroke-width="18"/>
    <path d="M142 160 C150 190 166 204 160 222" fill="none" stroke="#FF7A6B" stroke-width="18"/>
    <path d="M162 150 C180 175 200 180 206 200 C210 214 194 220 186 208" fill="none" stroke="#FF7A6B" stroke-width="18"/>
  </g>
  <!-- suckers -->
  <g fill="#FFD3C8">
    <circle cx="44" cy="196" r="3.5"/><circle cx="56" cy="182" r="3.5"/><circle cx="86" cy="206" r="3.5"/><circle cx="92" cy="188" r="3.5"/>
    <circle cx="122" cy="212" r="3.5"/><circle cx="120" cy="194" r="3.5"/><circle cx="156" cy="206" r="3.5"/><circle cx="150" cy="188" r="3.5"/>
    <circle cx="196" cy="196" r="3.5"/><circle cx="184" cy="182" r="3.5"/>
  </g>
  <!-- ears -->
  <path d="M58 70 C30 74 22 120 38 140 C50 154 66 138 70 118 Z" fill="#B5643F"/>
  <path d="M182 70 C210 74 218 120 202 140 C190 154 174 138 170 118 Z" fill="#B5643F"/>
  <!-- head -->
  <ellipse cx="120" cy="104" rx="66" ry="62" fill="#F4B47A"/>
  <ellipse cx="120" cy="128" rx="38" ry="28" fill="#FFE2C4"/>
  <!-- patch -->
  <path d="M146 56 C170 60 182 82 176 102 C166 96 150 92 140 80 Z" fill="#D98A55" opacity=".8"/>
  <!-- eyes -->
  <ellipse cx="96" cy="98" rx="11" ry="13" fill="#1B1F3B"/><ellipse cx="144" cy="98" rx="11" ry="13" fill="#1B1F3B"/>
  <circle cx="99" cy="93" r="4" fill="#fff"/><circle cx="147" cy="93" r="4" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="80" cy="120" rx="9" ry="6" fill="#FF8F9E" opacity=".55"/><ellipse cx="160" cy="120" rx="9" ry="6" fill="#FF8F9E" opacity=".55"/>
  <!-- nose and mouth -->
  <path d="M110 116 Q120 110 130 116 Q126 126 120 127 Q114 126 110 116 Z" fill="#1B1F3B"/>
  <path d="M120 127 L120 134 M120 134 Q111 142 104 136 M120 134 Q129 142 136 136" fill="none" stroke="#1B1F3B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M114 139 Q120 152 126 139 Z" fill="#FF6F8A"/>
  <!-- tiny bubble -->
  <circle cx="200" cy="40" r="9" fill="none" stroke="#7FD6E0" stroke-width="3"/><circle cx="216" cy="20" r="5" fill="none" stroke="#7FD6E0" stroke-width="3"/>
</svg>
